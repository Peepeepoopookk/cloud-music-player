name: Music Crawler

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      songs_per_run:
        description: 'Number of songs to download per run'
        required: false
        default: '7'

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write OAUTH_TOKEN secret
        run: |
          cat > token.json << 'EOF'
          ${{ secrets.OAUTH_TOKEN }}
          EOF
          chmod 600 token.json

      - name: Write OAUTH_CREDENTIALS secret
        run: |
          cat > oauth_credentials.json << 'EOF'
          ${{ secrets.OAUTH_CREDENTIALS }}
          EOF
          chmod 600 oauth_credentials.json

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          GDRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_MEDIA_FOLDER_ID=${{ secrets.GDRIVE_MEDIA_FOLDER_ID }}
          GDRIVE_DB_FILE_ID=${{ secrets.GDRIVE_DB_FILE_ID }}
          EOF
          chmod 600 .env

      - name: "Write YouTube cookies"
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > /tmp/cookies.txt
          chmod 600 /tmp/cookies.txt

      - name: Run Scraper
        env:
          SONGS_PER_RUN: ${{ github.event.inputs.songs_per_run || '7' }}
        run: |
          timeout 1800 python scraper/main.py

      - name: Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: scraper.log
          retention-days: 7

