name: Music Crawler

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      songs_per_run:
        description: 'Number of songs to download per run'
        required: false
        default: '5'

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write OAUTH_TOKEN secret
        run: |
          cat << 'EOF' > token.json
          ${{ secrets.OAUTH_TOKEN }}
          EOF

      - name: Write OAUTH_CREDENTIALS secret
        run: |
          cat << 'EOF' > oauth_credentials.json
          ${{ secrets.OAUTH_CREDENTIALS }}
          EOF

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          GOOGLE_SERVICE_ACCOUNT=${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_MEDIA_FOLDER_ID=${{ secrets.GDRIVE_MEDIA_FOLDER_ID }}
          EOF

      - name: Run Scraper
        env:
          SONGS_PER_RUN: ${{ github.event.inputs.songs_per_run || '5' }}
        run: |
          python scraper/main.py

      - name: Upload scraper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: scraper.log
          retention-days: 7
