<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imported Playlists | Wavify</title>
    <meta name="dashboard-write-token" content="{{ dashboard_write_token }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='auth.js') }}"></script>
    <style>
        .playlist-page {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 32px 40px;
        }
        .playlist-shell {
            display: grid;
            grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
            gap: 24px;
            align-items: start;
        }
        .playlist-list,
        .playlist-detail {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .playlist-list:hover,
        .playlist-detail:hover {
            border-color: var(--border-color-hover);
        }
        .playlist-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: #faf7f2;
        }
        .playlist-search {
            width: 100%;
            min-width: 0;
            padding: 9px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-color);
            font: inherit;
            font-size: 0.88rem;
        }
        .playlist-search:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .playlist-items {
            max-height: calc(100vh - 220px);
            overflow-y: auto;
        }
        .playlist-row {
            width: 100%;
            display: grid;
            grid-template-columns: 56px minmax(0, 1fr);
            gap: 14px;
            align-items: center;
            padding: 14px 16px;
            border: 0;
            border-bottom: 1px solid var(--border-color);
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .playlist-row:last-child {
            border-bottom: none;
        }
        .playlist-row:hover {
            background: var(--bg-card-hover);
        }
        .playlist-row.active {
            background: var(--primary-light);
            border-left: 3px solid var(--primary-color);
        }
        
        /* 2x2 Artwork Collage with scattered art-directed rotation */
        .cover-box {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            overflow: hidden;
            background: #ebe5d8;
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 2px;
            gap: 2px;
            box-shadow: 0 2px 6px rgba(42, 38, 32, 0.08);
        }
        .cover-box.single {
            display: block;
            padding: 0;
        }
        .cover-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 3px;
            transition: transform 0.2s ease;
        }
        .cover-box:not(.single) img:nth-child(1) { transform: rotate(-2deg); }
        .cover-box:not(.single) img:nth-child(2) { transform: rotate(2.5deg); }
        .cover-box:not(.single) img:nth-child(3) { transform: rotate(1.5deg); }
        .cover-box:not(.single) img:nth-child(4) { transform: rotate(-2deg); }
        .playlist-row:hover .cover-box img { transform: rotate(0deg); }

        .cover-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            grid-column: span 2;
            grid-row: span 2;
        }
        .playlist-name {
            font-weight: 700;
            color: var(--text-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.94rem;
        }
        .playlist-meta {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .detail-head {
            display: grid;
            grid-template-columns: 112px minmax(0, 1fr);
            gap: 20px;
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            background: #faf7f2;
        }
        .detail-cover {
            width: 112px;
            height: 112px;
            border-radius: 12px;
            overflow: hidden;
            background: #ebe5d8;
            border: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 3px;
            gap: 3px;
            box-shadow: 0 4px 16px rgba(42, 38, 32, 0.1);
        }
        .detail-cover.single {
            display: block;
            padding: 0;
        }
        .detail-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            transition: transform 0.25s ease;
        }
        .detail-cover:not(.single) img:nth-child(1) { transform: rotate(-2deg); }
        .detail-cover:not(.single) img:nth-child(2) { transform: rotate(2.5deg); }
        .detail-cover:not(.single) img:nth-child(3) { transform: rotate(1.5deg); }
        .detail-cover:not(.single) img:nth-child(4) { transform: rotate(-2deg); }
        .detail-cover:hover img { transform: rotate(0deg); }

        .detail-title {
            font-size: 1.65rem;
            color: var(--text-color);
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.025em;
            overflow-wrap: anywhere;
        }
        .detail-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .stat-pill {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            padding: 4px 12px;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            background: #ffffff;
        }
        .tracks-table-wrap {
            overflow: auto;
            max-height: calc(100vh - 340px);
        }
        .tracks-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            min-width: 980px;
        }
        .tracks-table col.col-index { width: 44px; }
        .tracks-table col.col-song { width: 31%; }
        .tracks-table col.col-artist { width: 16%; }
        .tracks-table col.col-genre { width: 10%; }
        .tracks-table col.col-language { width: 10%; }
        .tracks-table col.col-duration { width: 8%; }
        .tracks-table col.col-source { width: 15%; }
        .tracks-table col.col-drive { width: 10%; }
        .tracks-table th,
        .tracks-table td {
            padding: 6px 12px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            font-size: 0.86rem;
            vertical-align: middle;
            overflow: hidden;
            height: 48px;
        }
        .tracks-table th {
            color: var(--text-muted);
            font-size: 0.74rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: #f7f3eb;
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 8px 12px;
        }
        .track-cell {
            display: grid;
            grid-template-columns: 40px minmax(0, 1fr);
            gap: 12px;
            align-items: center;
            min-width: 0;
        }
        .track-art {
            width: 40px !important;
            height: 40px !important;
            min-width: 40px !important;
            min-height: 40px !important;
            max-width: 40px !important;
            max-height: 40px !important;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background: #ede7da;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px rgba(42, 38, 32, 0.08);
            flex-shrink: 0;
        }
        .track-title {
            display: block;
            color: var(--text-color);
            font-weight: 650;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .track-sub {
            display: block;
            color: var(--text-muted);
            font-size: 0.78rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 2px;
        }
        .cell-main {
            display: block;
            color: var(--text-color);
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .cell-wrap {
            display: block;
            color: var(--text-color);
            line-height: 1.35;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .cell-muted {
            color: var(--text-muted);
        }
        .drive-code {
            display: inline-block;
            max-width: 100%;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--bg-card-hover);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 0.75rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: middle;
        }
        .empty-state {
            padding: 56px 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.5;
        }
        .source-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .source-link:hover {
            text-decoration: underline;
        }
        @media (max-width: 900px) {
            .playlist-page {
                padding: 18px;
            }
            .playlist-shell {
                grid-template-columns: 1fr;
            }
            .playlist-items {
                max-height: 360px;
            }
            .detail-head {
                grid-template-columns: 76px minmax(0, 1fr);
            }
            .detail-cover {
                width: 76px;
                height: 76px;
            }
            .detail-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <header class="navbar" id="app-navbar">
        <div class="nav-brand">
            <svg class="brand-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.5 19C19.93 19 21.9 17.03 21.9 14.6C21.9 12.35 20.21 10.49 18 10.23C17.52 6.64 14.43 4 10.75 4C7.8 4 5.26 5.68 4.21 8.24C2.17 8.79 0.75 10.63 0.75 12.8C0.75 15.67 3.08 18 5.95 18H17.5M10 17v-6l4.5 3-4.5 3z" />
            </svg>
            <h1>Imported Playlists</h1>
        </div>
        <a href="/" class="btn btn-secondary" style="text-decoration: none;">&larr; Back to Dashboard</a>
    </header>

    <main class="playlist-page">
        <div class="section-header" style="margin-bottom: 24px;">
            <div class="section-title-wrap">
                <h2>Playlist Library</h2>
                <p class="section-desc" id="playlist-summary">Loading imported playlists...</p>
            </div>
            <button class="btn btn-secondary" id="btn-refresh-playlists">Refresh</button>
        </div>

        <div class="playlist-shell">
            <section class="playlist-list">
                <div class="playlist-toolbar">
                    <input class="playlist-search" id="playlist-search" type="search" placeholder="Search playlists...">
                </div>
                <div class="playlist-items" id="playlist-items">
                    <div class="empty-state">Loading playlists...</div>
                </div>
            </section>

            <section class="playlist-detail" id="playlist-detail">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--text-dim); margin-bottom: 12px;">
                        <path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>
                    </svg>
                    <p style="font-weight: 500;">Select a playlist from the catalog to browse its tracks.</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        const playlistItems = document.getElementById('playlist-items');
        const playlistDetail = document.getElementById('playlist-detail');
        const playlistSummary = document.getElementById('playlist-summary');
        const playlistSearch = document.getElementById('playlist-search');
        const btnRefresh = document.getElementById('btn-refresh-playlists');

        let allPlaylists = [];
        let selectedPlaylistId = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }

        function formatDate(value) {
            if (!value) return 'Unknown date';
            const parsed = new Date(value);
            if (Number.isNaN(parsed.getTime())) return value;
            return parsed.toLocaleString([], { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function coverMarkup(images, sizeClass = '') {
            const usable = Array.isArray(images) ? images.filter(Boolean).slice(0, 4) : [];
            if (!usable.length) {
                return `<div class="cover-box ${sizeClass}"><div class="cover-fallback">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>
                    </svg>
                </div></div>`;
            }
            if (usable.length === 1) {
                return `<div class="cover-box single ${sizeClass}"><img src="${escapeHtml(usable[0])}" alt=""></div>`;
            }
            return `<div class="cover-box ${sizeClass}">${usable.map(src => `<img src="${escapeHtml(src)}" alt="">`).join('')}</div>`;
        }

        function filteredPlaylists() {
            const q = playlistSearch.value.trim().toLowerCase();
            if (!q) return allPlaylists;
            return allPlaylists.filter(pl => {
                const haystack = `${pl.name || ''} ${pl.imported_via || ''} ${pl.source_url || ''}`.toLowerCase();
                return haystack.includes(q);
            });
        }

        function renderPlaylistList() {
            const playlists = filteredPlaylists();
            if (!playlists.length) {
                playlistItems.innerHTML = '<div class="empty-state">No imported playlists found.</div>';
                return;
            }
            playlistItems.innerHTML = playlists.map(pl => `
                <button class="playlist-row ${pl.id === selectedPlaylistId ? 'active' : ''}" data-playlist-id="${escapeHtml(pl.id)}">
                    ${coverMarkup(pl.cover_collage)}
                    <span>
                        <span class="playlist-name">${escapeHtml(pl.name)}</span>
                        <span class="playlist-meta">${pl.resolved_tracks || 0} songs · ${escapeHtml(pl.imported_via || 'dashboard')} · ${formatDate(pl.created_at)}</span>
                    </span>
                </button>
            `).join('');
        }

        function renderTrackRows(tracks) {
            if (!tracks.length) {
                return '<tr><td colspan="8" class="empty-state">No resolved songs found for this playlist.</td></tr>';
            }
            return tracks.map((track, index) => {
                const art = track.albumArt || track.album_art || '';
                const streamId = track.driveFileId || track.id || '';
                const shortId = streamId.length > 14 ? `${streamId.slice(0, 8)}...${streamId.slice(-4)}` : streamId;
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>
                            <div class="track-cell">
                                ${art ? `<img class="track-art" src="${escapeHtml(art)}" alt="">` : '<div class="track-art"></div>'}
                                <span>
                                    <span class="track-title">${escapeHtml(track.title)}</span>
                                    <span class="track-sub">${escapeHtml(track.album || 'Unknown Album')}</span>
                                </span>
                            </div>
                        </td>
                        <td><span class="cell-wrap">${escapeHtml(track.artist)}</span></td>
                        <td><span class="tag tag-genre">${escapeHtml(track.genre || 'Unknown')}</span></td>
                        <td><span class="tag tag-lang">${escapeHtml(track.language || 'unknown')}</span></td>
                        <td><span class="cell-main">${escapeHtml(track.duration || '--:--')}</span></td>
                        <td><span class="tag tag-source">${escapeHtml(track.source || 'unknown')}</span></td>
                        <td>${streamId ? `<code class="drive-code" title="${escapeHtml(streamId)}">${escapeHtml(shortId)}</code>` : ''}</td>
                    </tr>
                `;
            }).join('');
        }

        function renderPlaylistDetail() {
            const playlist = allPlaylists.find(pl => pl.id === selectedPlaylistId);
            if (!playlist) {
                playlistDetail.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--text-dim); margin-bottom: 12px;">
                            <path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>
                        </svg>
                        <p style="font-weight: 500;">Select a playlist from the catalog to browse its tracks.</p>
                    </div>`;
                return;
            }
            const tracks = playlist.tracks || [];
            const sourceLink = playlist.source_url
                ? `<a class="source-link" href="${escapeHtml(playlist.source_url)}" target="_blank" rel="noreferrer">Open Source Link &rarr;</a>`
                : '';
            playlistDetail.innerHTML = `
                <div class="detail-head">
                    ${coverMarkup(playlist.cover_collage, 'detail-cover')}
                    <div>
                        <div class="detail-title">${escapeHtml(playlist.name)}</div>
                        <div class="detail-stats">
                            <span class="stat-pill">${playlist.resolved_tracks || 0} resolved songs</span>
                            <span class="stat-pill">${playlist.total_tracks || 0} total tracked</span>
                            <span class="stat-pill">${escapeHtml(playlist.imported_via || 'dashboard')}</span>
                            <span class="stat-pill">${formatDate(playlist.created_at)}</span>
                            ${playlist.missing_track_ids?.length ? `<span class="stat-pill">${playlist.missing_track_ids.length} missing references</span>` : ''}
                            ${sourceLink ? `<span class="stat-pill">${sourceLink}</span>` : ''}
                        </div>
                    </div>
                </div>
                <div class="tracks-table-wrap">
                    <table class="tracks-table">
                        <colgroup>
                            <col class="col-index">
                            <col class="col-song">
                            <col class="col-artist">
                            <col class="col-genre">
                            <col class="col-language">
                            <col class="col-duration">
                            <col class="col-source">
                            <col class="col-drive">
                        </colgroup>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Song</th>
                                <th>Artist</th>
                                <th>Genre</th>
                                <th>Language</th>
                                <th>Duration</th>
                                <th>Source</th>
                                <th>Drive ID</th>
                            </tr>
                        </thead>
                        <tbody>${renderTrackRows(tracks)}</tbody>
                    </table>
                </div>
            `;
        }

        async function loadPlaylists() {
            playlistItems.innerHTML = '<div class="empty-state">Loading playlists...</div>';
            playlistDetail.innerHTML = '<div class="empty-state">Loading playlist details...</div>';
            try {
                const response = await fetch('/api/imported-playlists/details');
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to load imported playlists');
                allPlaylists = data.playlists || [];
                selectedPlaylistId = allPlaylists[0]?.id || null;
                playlistSummary.textContent = `${data.total_playlists || 0} playlists · ${data.total_tracks || 0} resolved songs`;
                renderPlaylistList();
                renderPlaylistDetail();
            } catch (error) {
                playlistSummary.textContent = 'Unable to load imported playlists.';
                playlistItems.innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`;
                playlistDetail.innerHTML = '<div class="empty-state">Playlist details unavailable.</div>';
            }
        }

        playlistItems.addEventListener('click', event => {
            const row = event.target.closest('.playlist-row');
            if (!row) return;
            selectedPlaylistId = row.dataset.playlistId;
            renderPlaylistList();
            renderPlaylistDetail();
        });

        playlistSearch.addEventListener('input', () => {
            const currentVisible = filteredPlaylists();
            if (currentVisible.length && !currentVisible.some(pl => pl.id === selectedPlaylistId)) {
                selectedPlaylistId = currentVisible[0].id;
                renderPlaylistDetail();
            }
            renderPlaylistList();
        });

        btnRefresh.addEventListener('click', loadPlaylists);
        loadPlaylists();
    </script>
</body>
</html>
